spring.application.name=portfolio
server.port=8080

# Brevo email config
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL:syncboardke@gmail.com}
brevo.sender.name=${BREVO_SENDER_NAME:Abraham Mutinda}
brevo.owner.email=${BREVO_OWNER_EMAIL:nthengesj@gmail.com}

# Database - must point to a real hosted Postgres instance on Render (no localhost)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Admin credentials - no hardcoded fallback in production
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}
